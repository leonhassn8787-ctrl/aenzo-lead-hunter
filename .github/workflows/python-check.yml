name: Python syntax and dependency check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned worker dependencies
        run: python -m pip install -r telegram-worker/requirements.txt
      - name: Compile Telegram worker and login helper
        run: python -m py_compile telegram-worker/worker.py telegram-worker/session_login.py
      - name: Verify required imports
        run: python -c "import telethon, httpx; print('Telethon and httpx imports OK')"
      - name: Test AENZO lead detection patterns
        working-directory: telegram-worker
        run: python -m unittest -v test_worker_rules.py
      - name: Validate Telegram dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/aenzo-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          if "lead-discovery-scan" in html or "Run discovery scan" in html or "Review candidates" in html:
              raise SystemExit("Legacy RSS dashboard references remain")
          print("Telegram dashboard source checks passed")
          PY
          node --check /tmp/aenzo-dashboard.js
      - name: Verify optional Docker build context
        run: docker build --tag aenzo-telegram-worker-check --file telegram-worker/Dockerfile .
