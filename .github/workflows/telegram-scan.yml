name: AENZO Telegram Group Lead Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: aenzo-telegram-lead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scan progress
        uses: actions/cache/restore@v4
        with:
          path: telegram-worker/scan_state.json
          key: telegram-state-${{ github.run_id }}
          restore-keys: |
            telegram-state-

      - name: Check required private credentials
        id: preflight
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
        run: |
          python - <<'PY'
          import os
          required = [
              "TELEGRAM_API_ID", "TELEGRAM_API_HASH", "TELEGRAM_SESSION_STRING",
              "SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_OWNER_ID",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Scan safely skipped; private GitHub Actions secrets are not configured: " + ", ".join(missing))
              configured = "false"
          else:
              print("All required private credentials are configured.")
              configured = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"configured={configured}\n")
          PY

      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: python -m pip install -r telegram-worker/requirements.txt

      - name: Validate Telegram session format
        id: session
        if: steps.preflight.outputs.configured == 'true'
        env:
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python - <<'PY'
          import os
          from telethon.sessions import StringSession

          try:
              StringSession(os.environ["TELEGRAM_SESSION_STRING"].strip())
          except Exception:
              print(
                  "Telegram scan safely skipped: TELEGRAM_SESSION_STRING is malformed or truncated. "
                  "Replace it only with a fresh private StringSession generated in a trusted environment. "
                  "Never share the session in chat or commit it to the repository."
              )
              valid = "false"
          else:
              print("Telegram session string format is valid.")
              valid = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"valid={valid}\n")
          PY

      - name: Scan Telegram groups once
        if: steps.preflight.outputs.configured == 'true' && steps.session.outputs.valid == 'true'
        working-directory: telegram-worker
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          STATE_FILE: scan_state.json
          MAX_MESSAGES_PER_GROUP: "200"
          LOOKBACK_DAYS: "30"
        run: python worker.py --once

      - name: Save scan progress
        if: always() && steps.preflight.outputs.configured == 'true' && steps.session.outputs.valid == 'true' && hashFiles('telegram-worker/scan_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: telegram-worker/scan_state.json
          key: telegram-state-${{ github.run_id }}
