name: AENZO Telegram Group Lead Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: aenzo-telegram-lead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scan progress
        uses: actions/cache/restore@v4
        with:
          path: telegram-worker/scan_state.json
          key: telegram-state-${{ github.run_id }}
          restore-keys: |
            telegram-state-

      - name: Check required private credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
        run: |
          python - <<'PY'
          import os
          required = [
              "TELEGRAM_API_ID", "TELEGRAM_API_HASH", "TELEGRAM_SESSION_STRING",
              "SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_OWNER_ID",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Telegram scan is not configured yet. Add these GitHub Actions secrets: " + ", ".join(missing))
              raise SystemExit(1)
          print("All required private credentials are configured.")
          PY

      - name: Install dependencies
        run: python -m pip install -r telegram-worker/requirements.txt

      - name: Scan Telegram groups once
        working-directory: telegram-worker
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          STATE_FILE: scan_state.json
          MAX_MESSAGES_PER_GROUP: "200"
          LOOKBACK_DAYS: "30"
        run: python worker.py --once

      - name: Save scan progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-worker/scan_state.json
          key: telegram-state-${{ github.run_id }}
