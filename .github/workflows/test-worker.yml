name: AENZO Telegram Worker Tests

on:
  # Pull requests and intentional manual runs only; main-branch pushes are covered by python-check.yml.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Run lead qualification and scan-rule tests
        working-directory: telegram-worker
        run: python -m unittest -v test_worker_rules.py
