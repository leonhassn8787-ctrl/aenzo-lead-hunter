name: AENZO Web Discovery Scan

on:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aenzo-web-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan public project and funding signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          AENZO_BOT_TOKEN: ${{ secrets.AENZO_BOT_TOKEN }}
          AENZO_BOT_CHAT_ID: ${{ secrets.AENZO_BOT_CHAT_ID }}
          WEB_LOOKBACK_DAYS: "10"
          WEB_MAX_ITEMS_PER_SOURCE: "35"
        run: python web-discovery-worker/scanner.py
