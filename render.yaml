services:
  - type: worker
    name: aenzo-telegram-lead-hunter
    runtime: docker
    plan: starter
    dockerfilePath: ./telegram-worker/Dockerfile
    dockerContext: .
    disk:
      name: aenzo-telegram-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: SUPABASE_URL
        value: https://royezoicromoebaxqzhx.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_OWNER_ID
        sync: false
      - key: SESSION_FILE
        value: /data/aenzo_telegram.session
      - key: STATE_FILE
        value: /data/scan_state.json
      - key: POLL_SECONDS
        value: "14400"
      - key: LOOKBACK_DAYS
        value: "30"
      - key: GLOBAL_SEARCH_MAX_PAGES
        value: "3"
      - key: SCAN_BUDGET_SECONDS
        value: "1320"
      - key: MAX_MESSAGES_PER_RUN
        value: "1300"
      - key: MAX_PUBLIC_MESSAGES_PER_RUN
        value: "300"
      - key: MAX_JOINED_MESSAGES_PER_RUN
        value: "1000"
      - key: AENZO_BOT_TOKEN
        sync: false
      - key: AENZO_BOT_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
